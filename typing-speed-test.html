<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TYPEMASTER — Typing Speed Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #030d08;
    --green: #00ff88;
    --green-dim: #00ff8840;
    --green-glow: #00ff8860;
    --amber: #ffb800;
    --red: #ff3c5a;
    --surface: #051209;
    --border: #00ff8820;
    --font: 'Share Tech Mono', monospace;
    --display: 'Orbitron', monospace;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }

  /* Scanlines effect */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* Screen flicker */
  @keyframes flicker {
    0%, 98%, 100% { opacity: 1; }
    99% { opacity: 0.97; }
  }
  body { animation: flicker 8s infinite; }

  .title-bar {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .title-bar h1 {
    font-family: var(--display);
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 0.2em;
    color: var(--green);
    text-shadow: 0 0 30px var(--green-glow), 0 0 60px var(--green-dim);
  }

  .title-bar p {
    font-size: 0.7rem;
    color: #00ff8870;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.3rem;
  }

  .stats-row {
    display: flex; gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 2rem;
    width: 100%; max-width: 700px;
  }

  .stat {
    flex: 1; padding: 1rem;
    background: var(--surface);
    text-align: center;
  }

  .stat-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #00ff8860;
    margin-bottom: 0.4rem;
  }

  .stat-val {
    font-family: var(--display);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 15px var(--green-glow);
    line-height: 1;
  }

  .stat-unit {
    font-size: 0.55rem;
    color: #00ff8860;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* Progress bar */
  .progress-track {
    width: 100%; max-width: 700px;
    height: 3px; background: var(--border);
    margin-bottom: 1.5rem;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    width: 0%;
    transition: width 0.2s ease;
  }

  /* Text display */
  .text-container {
    width: 100%; max-width: 700px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 2rem;
    margin-bottom: 1.5rem;
    line-height: 2;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    min-height: 120px;
    position: relative;
  }

  .text-container::before {
    content: '> TEXT_BUFFER';
    position: absolute; top: 0.5rem; left: 1rem;
    font-size: 0.6rem;
    color: #00ff8840;
    letter-spacing: 0.2em;
  }

  .char { position: relative; }
  .char.correct { color: var(--green); }
  .char.wrong { color: var(--red); background: rgba(255,60,90,0.15); }
  .char.pending { color: #00ff8840; }
  .char.current {
    color: var(--bg);
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: blink 0.7s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { background: var(--green); color: var(--bg); }
    50% { background: transparent; color: var(--green); }
  }

  /* Input */
  .input-row {
    width: 100%; max-width: 700px;
    display: flex; gap: 1rem;
  }

  #typingInput {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: var(--font);
    font-size: 1rem;
    padding: 1rem 1.5rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 0.05em;
  }

  #typingInput:focus {
    border-color: var(--green);
    box-shadow: 0 0 20px var(--green-dim), inset 0 0 10px rgba(0,255,136,0.03);
  }

  #typingInput:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .action-btn {
    padding: 1rem 2rem;
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: var(--display);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .action-btn:hover {
    background: var(--green);
    color: var(--bg);
    box-shadow: 0 0 20px var(--green-glow);
  }

  /* Difficulty selector */
  .diff-row {
    display: flex; gap: 0.5rem;
    margin-bottom: 1.5rem;
    width: 100%; max-width: 700px;
  }

  .diff-btn {
    padding: 0.4rem 1rem;
    border: 1px solid var(--border);
    background: transparent;
    color: #00ff8860;
    font-family: var(--font);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  .diff-btn.active {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-dim);
  }

  /* Result overlay */
  .result-panel {
    display: none;
    width: 100%; max-width: 700px;
    background: var(--surface);
    border: 1px solid var(--green);
    box-shadow: 0 0 40px var(--green-dim);
    padding: 2.5rem;
    text-align: center;
    margin-top: 1.5rem;
  }

  .result-panel.show { display: block; animation: fadeIn 0.4s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

  .result-panel h2 {
    font-family: var(--display);
    font-size: 1rem;
    letter-spacing: 0.3em;
    color: var(--amber);
    margin-bottom: 1.5rem;
    text-shadow: 0 0 20px var(--amber);
  }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .result-item .r-val {
    font-family: var(--display);
    font-size: 2.5rem;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 20px var(--green);
  }

  .result-item .r-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: #00ff8860;
    text-transform: uppercase;
    margin-top: 0.3rem;
  }

  .grade {
    font-family: var(--display);
    font-size: 4rem;
    font-weight: 900;
    color: var(--amber);
    text-shadow: 0 0 40px var(--amber);
    margin-bottom: 0.5rem;
  }

  .timer-bar {
    width: 100%; max-width: 700px;
    margin-bottom: 0.5rem;
    display: flex; align-items: center; justify-content: space-between;
  }

  .timer-label {
    font-size: 0.65rem; letter-spacing: 0.2em; color: #00ff8860;
  }
</style>
</head>
<body>

<div class="title-bar">
  <h1>TYPEMASTER</h1>
  <p>Terminal Typing Speed Test</p>
</div>

<div class="stats-row">
  <div class="stat">
    <div class="stat-label">WPM</div>
    <div class="stat-val" id="wpmStat">0</div>
    <div class="stat-unit">words/min</div>
  </div>
  <div class="stat">
    <div class="stat-label">Accuracy</div>
    <div class="stat-val" id="accStat">100</div>
    <div class="stat-unit">percent</div>
  </div>
  <div class="stat">
    <div class="stat-label">Time</div>
    <div class="stat-val" id="timeStat">60</div>
    <div class="stat-unit">seconds</div>
  </div>
  <div class="stat">
    <div class="stat-label">Errors</div>
    <div class="stat-val" id="errStat">0</div>
    <div class="stat-unit">mistakes</div>
  </div>
</div>

<div class="timer-label" style="width:100%;max-width:700px;margin-bottom:4px;">TIME REMAINING</div>
<div class="progress-track">
  <div class="progress-fill" id="progressBar"></div>
</div>

<div class="diff-row">
  <span style="font-size:0.65rem;letter-spacing:0.15em;color:#00ff8860;align-self:center;text-transform:uppercase;">Difficulty:</span>
  <button class="diff-btn active" onclick="setDiff('easy',this)">Easy</button>
  <button class="diff-btn" onclick="setDiff('medium',this)">Medium</button>
  <button class="diff-btn" onclick="setDiff('hard',this)">Hard</button>
</div>

<div class="text-container" id="textDisplay"></div>

<div class="input-row">
  <input type="text" id="typingInput" placeholder="[ CLICK HERE AND START TYPING... ]" disabled />
  <button class="action-btn" id="actionBtn" onclick="startOrReset()">START</button>
</div>

<div class="result-panel" id="resultPanel">
  <h2>// RESULTS COMPUTED //</h2>
  <div class="grade" id="gradeEl">A+</div>
  <div class="result-grid">
    <div class="result-item">
      <div class="r-val" id="rWpm">0</div>
      <div class="r-label">WPM</div>
    </div>
    <div class="result-item">
      <div class="r-val" id="rAcc">0%</div>
      <div class="r-label">Accuracy</div>
    </div>
    <div class="result-item">
      <div class="r-val" id="rErr">0</div>
      <div class="r-label">Errors</div>
    </div>
  </div>
  <button class="action-btn" style="width:100%;" onclick="startOrReset()">RETRY_</button>
</div>

<script>
const TEXTS = {
  easy: [
    "the quick brown fox jumps over the lazy dog near the river bank on a sunny day",
    "she sells sea shells by the sea shore and the shells are very beautiful and bright",
    "the sun rises in the east and sets in the west every single day without fail",
    "a good book is the best friend you can have on a cold and rainy afternoon"
  ],
  medium: [
    "programming is the art of telling another human being what one wants the computer to do in a precise and logical way",
    "the best way to predict the future is to create it yourself through hard work discipline and creative thinking",
    "technology is neither good nor bad nor is it neutral it simply amplifies human intention and capability",
    "success is not final failure is not fatal it is the courage to continue that counts in the end"
  ],
  hard: [
    "the JavaScript event loop is a fundamental concept: it processes callbacks from the queue when the call stack is empty, enabling asynchronous non-blocking I/O operations efficiently.",
    "quantum computing leverages superposition & entanglement to process information exponentially faster than classical binary systems, potentially revolutionizing cryptography, drug discovery, and optimization problems.",
    "in CSS, specificity is calculated as: inline styles (1000) > IDs (100) > classes/attributes (10) > elements (1); !important overrides everything except another !important declaration.",
    "polymorphism allows objects of different types to be treated uniformly via shared interfaces; runtime polymorphism uses virtual dispatch while compile-time uses templates & function overloading."
  ]
};

let currentText = '';
let currentIndex = 0;
let errors = 0;
let totalTyped = 0;
let timer = null;
let timeLeft = 60;
let started = false;
let finished = false;
let currentDiff = 'easy';
let timeDuration = 60;

function setDiff(d, btn) {
  if (started) return;
  currentDiff = d;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  setupText();
}

function setupText() {
  const arr = TEXTS[currentDiff];
  currentText = arr[Math.floor(Math.random() * arr.length)];
  renderText();
}

function renderText() {
  const display = document.getElementById('textDisplay');
  display.innerHTML = currentText.split('').map((ch, i) => {
    let cls = 'pending';
    if (i < currentIndex) cls = 'correct';
    if (i === currentIndex) cls = 'current';
    return `<span class="char ${cls}">${ch === ' ' ? '&nbsp;' : ch}</span>`;
  }).join('');
}

function updateRenderedChar(index, cls) {
  const chars = document.querySelectorAll('.char');
  if (chars[index]) {
    chars[index].className = 'char ' + cls;
  }
}

function startOrReset() {
  clearInterval(timer);
  started = false; finished = false;
  currentIndex = 0; errors = 0; totalTyped = 0;
  timeLeft = timeDuration;

  document.getElementById('resultPanel').classList.remove('show');
  document.getElementById('typingInput').value = '';
  document.getElementById('typingInput').disabled = false;
  document.getElementById('typingInput').focus();
  document.getElementById('actionBtn').textContent = 'RESET';
  document.getElementById('wpmStat').textContent = '0';
  document.getElementById('accStat').textContent = '100';
  document.getElementById('timeStat').textContent = timeLeft;
  document.getElementById('errStat').textContent = '0';
  document.getElementById('progressBar').style.width = '100%';

  setupText();
}

function startTimer() {
  started = true;
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timeStat').textContent = timeLeft;
    document.getElementById('progressBar').style.width = (timeLeft / timeDuration * 100) + '%';
    updateLiveStats();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function updateLiveStats() {
  const elapsed = (timeDuration - timeLeft) || 1;
  const words = Math.floor(totalTyped / 5);
  const wpm = Math.round(words / (elapsed / 60));
  const acc = totalTyped > 0 ? Math.round(((totalTyped - errors) / totalTyped) * 100) : 100;
  document.getElementById('wpmStat').textContent = wpm;
  document.getElementById('accStat').textContent = acc;
}

document.getElementById('typingInput').addEventListener('input', function(e) {
  if (finished) return;
  if (!started) startTimer();

  const typed = this.value;
  const lastChar = typed[typed.length - 1];

  if (currentIndex >= currentText.length) return;

  totalTyped++;

  if (lastChar === currentText[currentIndex]) {
    updateRenderedChar(currentIndex, 'correct');
    currentIndex++;
    if (currentIndex < currentText.length) updateRenderedChar(currentIndex, 'current');
  } else {
    updateRenderedChar(currentIndex, 'wrong');
    errors++;
    document.getElementById('errStat').textContent = errors;
  }

  if (currentIndex >= currentText.length) {
    // All text typed — load new text
    currentIndex = 0;
    setupText();
  }

  this.value = '';
  updateLiveStats();
});

function endGame() {
  clearInterval(timer);
  finished = true;
  document.getElementById('typingInput').disabled = true;

  const elapsed = timeDuration;
  const words = Math.floor(totalTyped / 5);
  const wpm = Math.round(words / (elapsed / 60));
  const acc = totalTyped > 0 ? Math.round(((totalTyped - errors) / totalTyped) * 100) : 100;

  document.getElementById('rWpm').textContent = wpm;
  document.getElementById('rAcc').textContent = acc + '%';
  document.getElementById('rErr').textContent = errors;

  let grade = 'F';
  if (wpm >= 80 && acc >= 95) grade = 'S';
  else if (wpm >= 60 && acc >= 90) grade = 'A';
  else if (wpm >= 45 && acc >= 85) grade = 'B';
  else if (wpm >= 30 && acc >= 80) grade = 'C';
  else if (wpm >= 20) grade = 'D';

  document.getElementById('gradeEl').textContent = grade;
  document.getElementById('resultPanel').classList.add('show');
  document.getElementById('actionBtn').textContent = 'RESTART';
}

// Init
setupText();
</script>
</body>
</html>
